name: GapGPT Structured Understanding Smoke

on:
  workflow_dispatch:

jobs:
  structured-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Verify ZIP and extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="workspace-01a0078c-b64b-74c7-acb6-50546f38c794.zip"
          EXPECTED_SHA256="cd514206e350cbd4c66d2504a6239ef20a11e19e40adad2f642ac9622f48128c"
          test -f "$ZIP"
          echo "$EXPECTED_SHA256  $ZIP" | sha256sum --check --strict
          unzip -q "$ZIP" -d /tmp/athena-workspace
          PROJECT="/tmp/athena-workspace/vmania-athena-runtime-poc-01e1"
          test -f "$PROJECT/pyproject.toml"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m pip install -e '.[dev]'

      - name: Run all non-integration tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -q -m "not integration"

      - name: Discover and confirm model inventory
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python -m athena_runtime.providers.gapgpt_discover \
            --json-output artifacts/gapgpt-model-inventory.json \
            --markdown-output artifacts/gapgpt-model-inventory.md

      - name: Print bounded call plan
        run: echo "Logical call plan = 20 (4 allowlisted models x 5 synthetic cases)"

      - name: Run structured understanding smoke
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python -m athena_runtime.providers.gapgpt_smoke \
            --inventory artifacts/gapgpt-model-inventory.json \
            --json-output artifacts/gapgpt-understanding-smoke.json \
            --markdown-output artifacts/gapgpt-understanding-smoke.md

      - name: Upload sanitized smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gapgpt-understanding-smoke
          path: ${{ env.PROJECT_DIR }}/artifacts/
          retention-days: 3
          if-no-files-found: error
