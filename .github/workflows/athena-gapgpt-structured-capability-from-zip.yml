name: GapGPT Structured Output Capability

on:
  workflow_dispatch:

jobs:
  structured-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Verify ZIP and extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="workspace-01e2-clean.zip"
          EXPECTED_SHA256="0ba73ef6616d0778a1ecaf03453b1baca69b85cd9d7130706a2c567ecad5a2bc"
          test -f "$ZIP"
          echo "$EXPECTED_SHA256  $ZIP" | sha256sum --check --strict
          unzip -q "$ZIP" -d /tmp/athena-workspace
          PROJECT="/tmp/athena-workspace/vmania-athena-runtime-poc-01e2"
          test -f "$PROJECT/pyproject.toml"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m pip install -e '.[dev]'

      - name: Run all non-integration tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -q -m "not integration"

      - name: Discover model inventory
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python -m athena_runtime.providers.gapgpt_discover \
            --json-output artifacts/gapgpt-model-inventory.json \
            --markdown-output artifacts/gapgpt-model-inventory.md

      - name: Print bounded plan
        run: echo "Stage A = 4 calls; Stage B = pass-only; hard cap = 8; no retry, repair, or fallback"

      - name: Run structured capability probe
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python -m athena_runtime.providers.gapgpt_structured_probe \
            --inventory artifacts/gapgpt-model-inventory.json \
            --json-output artifacts/gapgpt-structured-capability.json \
            --markdown-output artifacts/gapgpt-structured-capability.md

      - name: Upload sanitized artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gapgpt-structured-capability
          path: |
            ${{ env.PROJECT_DIR }}/artifacts/gapgpt-model-inventory.json
            ${{ env.PROJECT_DIR }}/artifacts/gapgpt-model-inventory.md
            ${{ env.PROJECT_DIR }}/artifacts/gapgpt-structured-capability.json
            ${{ env.PROJECT_DIR }}/artifacts/gapgpt-structured-capability.md
          retention-days: 3
          if-no-files-found: error
